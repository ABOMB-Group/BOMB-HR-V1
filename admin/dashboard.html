<i>⌄</i>

<h3>通知與待辦</h3>

</div>
<button class="icon-btn" data-close-drawer aria-label="關閉通知與待辦">×</button>
</div>
<div class="drawer-tabs">
<button class="active" data-drawer-tab="notify">通知 <span>0</span>
</button>
<button data-drawer-tab="task">待辦 <span>0</span>
</button>
</div>
<div id="drawerBody">
</div>
<div class="sound-setting">
<div>
<b>重要事件音效</b>
<small>請假、補卡與重大異常</small>
</div>
<button class="sound-test-btn" id="soundTestBtn" type="button">測試音效</button>
<label class="switch">
<input id="soundSwitch" type="checkbox" checked>
<span>
</span>
</label>
</div>
</aside>
<div class="drawer-mask" id="drawerMask">
</div>
<div class="popover" id="scopePopover">
<div class="pop-head pop-head-row">
<div>
<b>切換公司／據點</b>
<small>資料依權限範圍隔離</small>
</div>
<button class="icon-btn compact-close" data-close-popover="scopePopover" aria-label="關閉公司據點選單">×</button>
</div>
<label class="search-field">⌕<input id="scopeSearch" placeholder="搜尋公司或據點">

<div id="scopeList">
</div>
</div>
<div class="popover profile-pop" id="profilePopover">
<div class="popover-close-row">
<button class="icon-btn compact-close" data-close-popover="profilePopover" aria-label="關閉帳號選單">×</button>
</div>
<button data-profile="account">我的帳號</button>
<button data-profile="permission">查看權限範圍</button>
<button data-action="logout">安全登出</button>

<div class="command-head">

</label>
<button class="icon-btn" data-command-close aria-label="關閉搜尋">×</button>
</div>
<div id="searchResults">
</div>
<small>ESC 關閉 · Enter 開啟</small>
